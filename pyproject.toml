[project]
name = "firewall-excel-finder"
version = "0.1.0"
description = "大量 Excel 防火牆規則檔的查找與篩選工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.5",
    "pyside6>=6.12.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 79

[dependency-groups]
dev = [
    "nuitka>=4.3.5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-openpyxl>=3.1.5.20261017",
]
